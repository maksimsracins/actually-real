appId: com.actuallyreal.scanner
---
# Requires photo library permission to already be granted (see launchApp
# `permissions` in the parent flow) and at least one photo in the simulator's
# library (see `addMedia` in the parent flow).
- tapOn:
    id: "choose-library-button"
- tapOn:
    point: "50%,40%" # first thumbnail in the system photo picker grid
- assertVisible: "Analyzing image…"
# This hits the real backend (scanImage), so give it real network time.
# If the daily free-scan cap has been hit, the app shows an upgrade prompt
# instead of a result — that's a separate, expected outcome, not a failure
# of the scan flow itself.
- extendedWaitUntil:
    visible: "Scan another photo"
    timeout: 30000
